# Prometheus scrape configuration for the vLLM - Qwen3.8-Flash-Next FP8 recipe.
#
# vLLM serves Prometheus metrics on /metrics by default -- no extra engine flag
# is needed. With VLLM_USE_RUST_FRONTEND=1 the vllm-rs frontend serves them.
# Do not pass --disable-log-stats: it stops the stat loggers that feed these
# metrics.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  # vLLM engine metrics (vllm:* + http_* request counters).
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["qwen-3-8-flash-next-fp8:8000"]
        labels:
          instance: qwen-3-8-flash-next-fp8

  # Prometheus itself, so the scrape/target health of Prometheus is visible.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # GPU telemetry for all four cards from the NVML exporter (compose service
  # gpu-exporter). Its metric prefix is nvidia_smi_*; the dashboard splits the
  # series per card via nvidia_smi_gpu_info's index label.
  - job_name: gpu
    static_configs:
      - targets: ["gpu-exporter:9835"]
        labels:
          instance: gpus
