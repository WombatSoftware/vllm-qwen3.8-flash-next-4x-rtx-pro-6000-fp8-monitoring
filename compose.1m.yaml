# ALTERNATIVE engine definition: the same Qwen3.8-Flash-Next FP8 recipe at a
# 1,048,576-token (1 Mi-token) context instead of the checkpoint's native
# 262,144. Engine service only — Prometheus, Grafana and the GPU exporter keep
# running from compose.yaml.
#
# This file is NOT additive on top of compose.yaml (no `-f ... -f ...` merge):
# it redefines the one service whose `command:` differs. It shares compose.yaml's
# project name, network, container name and ports, so exactly one of the two
# engine definitions is up at a time — which is the right constraint anyway,
# since only one engine fits these four cards at 0.95 utilisation.
#
#   switch the engine to 1M context:
#     docker compose -f compose.1m.yaml up -d qwen-3-8-flash-next-fp8
#   back to native 262,144:
#     docker compose up -d qwen-3-8-flash-next-fp8
#
# compose prints an "orphan containers" notice for prometheus/grafana/
# gpu-exporter on the first command because they are not defined in THIS file.
# Ignore it; never act on it. Never pass --remove-orphans and never `down`
# (AGENTS.md: that takes the monitoring stack with it).
#
# Not booted, not benchmarked (2026-11-15). See the two added flags below for
# what was verified without a boot and what was not.

# Same project as compose.yaml: same default network (Prometheus scrapes the
# engine by container name), same volume namespace, same recreate semantics.
name: qwen-3-8-flash-next-fp8

services:
  qwen-3-8-flash-next-fp8:
    # Same pinned image as compose.yaml. On a pin move, mirror that file's
    # engine block here: everything in this file except --max-model-len and
    # --hf-overrides must stay identical to compose.yaml's service.
    image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
    pull_policy: never
    container_name: qwen-3-8-flash-next-fp8
    restart: ${RESTART_POLICY:-always}
    stop_grace_period: 60s
    init: true
    ipc: host
    shm_size: 32g
    ulimits:
      memlock: -1
    ports:
      - "${VLLM_BIND:-127.0.0.1}:${VLLM_PORT:-8000}:8000"
    environment:
      VLLM_USE_RUST_FRONTEND: "1"
      HF_TOKEN: "${HF_TOKEN:-}"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    volumes:
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
      - ${VLLM_CACHE_DIR:-~/.cache/vllm}:/root/.cache/vllm
      - ${TORCH_CACHE_DIR:-~/.cache/torch}:/root/.cache/torch
      - ${FLASHINFER_CACHE_DIR:-~/.cache/flashinfer}:/root/.cache/flashinfer
      - ./chat_template.jinja:/opt/vllm/chat_template.jinja:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1", "2", "3"]
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 3600s
    command:
      - Qwen/Qwen3.8-Flash-Next-FP8
      - --served-model-name
      - Qwen3.8-Flash-Next-FP8
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # ---- added on top of compose.yaml's flag list (everything else is
      # identical, and that list is load-bearing in compose.yaml — read the
      # flag notes there) ----------------------------------------------
      #
      # --max-model-len 1048576
      #   1 Mi tokens. Cannot be requested on its own: vLLM derives the
      #   allowed maximum from the checkpoint's text_config
      #   (max_position_embeddings = 262,144) and rejects 1,048,576 without
      #   the RoPE override below. Do NOT paper over that with
      #   VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 — that env var skips the check
      #   while the positions still come from the native embedding.
      - --max-model-len
      - "1048576"
      #
      # --hf-overrides: YaRN extrapolation 262,144 -> 1,048,576 (factor 4)
      #   The checkpoint ships rope_type "default" — no built-in scaling —
      #   so 1M needs YaRN applied to the TEXT sub-config's rope parameters:
      #   rope_type yarn + factor 4 + original_max_position_embeddings
      #   262144, keeping the checkpoint's mrope_interleaved/mrope_section
      #   [11,11,10]/partial_rotary_factor 0.25/rope_theta 1e7, and
      #   max_position_embeddings raised to the scaled value (the vLLM
      #   loader treats YaRN max_position_embeddings as already scaled and
      #   derives the accepted context length from it).
      #
      #   Verified inside the pinned image WITHOUT a boot (2026-11-15, CPU
      #   dry run of EngineArgs.create_engine_config with the full flag set
      #   above): the flag list parses end to end, scheduler keeps chunked
      #   prefill on (8192-token chunks, ~128 chunks for a 1M prompt),
      #   kv_cache_dtype stays fp8, and the MTP-3 speculative config builds.
      #   The override nests under "text_config" as a PARTIAL dict on
      #   purpose: hf_overrides is a shallow config.update(), but the
      #   transformers in this image re-coerces a dict assigned to a declared
      #   sub-config, and the dry run confirmed every other text field
      #   survives (48 layers, vocab 248320, head_dim 256, the
      #   linear/indexed-attention layer_types, the mtp fields). Do not
      #   "complete" this dict from config.json — that variant failed the
      #   dry run.
      #
      #   NOT verified here, all three are boot-and-measure items:
      #   - that the engine comes up at all (a boot re-sizes the KV pool at
      #     runtime; see README step 3 after starting it),
      #   - the MTP draft's effective length: the dry run's draft
      #     ModelConfig still showed its own 262,144; vLLM pushes the
      #     target length to the draft at engine build, and the boot log's
      #     speculative_config= line is where to check that,
      #   - generation QUALITY at 4x YaRN (the checkpoint family's own
      #     256K->1M step uses this trick, but nothing here measured it —
      #     AGENTS.md: no performance or quality claim without a sweep).
      #
      #   KV math for the dashboard's kv_pool_tokens (~7.08M tokens on
      #   recent boots): ~6.7 concurrent full-1M requests, vs 27.0x at the
      #   native length. The pool itself does not move with max_model_len
      #   (it is sized from free memory after warmup), but re-read the boot
      #   log and refresh the variable anyway, per AGENTS.md.
      - --hf-overrides
      - '{"text_config": {"rope_parameters": {"mrope_interleaved": true, "mrope_section": [11, 11, 10], "partial_rotary_factor": 0.25, "rope_theta": 10000000, "rope_type": "yarn", "factor": 4.0, "original_max_position_embeddings": 262144}, "max_position_embeddings": 1048576}}'
      # ------------------------------------------------------------------
      - --max-num-seqs
      - "16"
      - --gpu-memory-utilization
      - "0.95"
      - --max-num-batched-tokens
      - "8192"
      - --enable-prefix-caching
      - --enable-expert-parallel
      - --tensor-parallel-size
      - "4"
      - --kv-cache-dtype
      - fp8
      - --attention-config.indexer_kv_dtype
      - fp8
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
      - --chat-template
      - /opt/vllm/chat_template.jinja
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
